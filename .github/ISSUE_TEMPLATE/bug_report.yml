name: Bug report
description: Report a reproducible SyncLounge defect.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include exact steps, room/client roles, and whether the issue reproduces after a clean reload.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image tag
      placeholder: 6.1.18 or dev-<commit SHA>
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and Plex client
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove Plex tokens, cookies, private hostnames, room names, and personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials and private server details.
          required: true
