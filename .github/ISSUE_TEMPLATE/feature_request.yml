name: Feature request
description: Propose a concrete SyncLounge workflow improvement.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: limitation
    attributes:
      label: Current limitation
      description: What prevents or complicates that workflow today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe observable behavior rather than only naming a technology.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials and private server details.
          required: true
