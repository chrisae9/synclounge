version: 2
updates:
- package-ecosystem: npm
  directories:
  - /
  - /packages/syncloungeserver
  schedule:
    interval: daily
    time: "04:00"
    timezone: America/New_York
  open-pull-requests-limit: 5
  commit-message:
    prefix: build(deps)
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  versioning-strategy: increase
- package-ecosystem: docker
  directories:
  - /
  schedule:
    interval: daily
    time: "04:00"
    timezone: America/New_York
  open-pull-requests-limit: 5
  commit-message:
    prefix: build(deps)
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directories:
  - /
  schedule:
    interval: daily
    time: "04:00"
    timezone: America/New_York
  open-pull-requests-limit: 5
  commit-message:
    prefix: build(deps)
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
